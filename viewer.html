<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Solution</title>

  <style>
    html, body, #viewer {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #viewer {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #viewer svg {
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
    }
  </style>
</head>

<body>

<div id="viewer"></div>

<script>
  const f = new URLSearchParams(location.search).get('f');
  const viewer = document.getElementById('viewer');

  if (f) fetch('solutions/' + encodeURIComponent(f))
    .then(r => r.text())
    .then(text => {
      viewer.innerHTML = text;

      const svg = viewer.querySelector('svg');

      svg.removeAttribute('width');
      svg.removeAttribute('height');

      svg.querySelector(
        ':scope > rect[width="100%"][height="100%"]'
      )?.remove();

      requestAnimationFrame(() => {
        const b = svg.getBBox();
        const p = 1;

        svg.setAttribute(
          'viewBox',
          `${b.x-p} ${b.y-p} ${b.width+p*2} ${b.height+p*2}`
        );

        svg.setAttribute(
          'preserveAspectRatio',
          'xMidYMid meet'
        );
      });
    });
</script>

</body>
</html>
